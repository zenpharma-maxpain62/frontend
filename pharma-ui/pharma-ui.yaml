apiVersion: v1
kind: Service
metadata:
  name: pharma-ui
  labels:
    helm.sh/chart: pharma-ui-0.1.0
    app.kubernetes.io/name: pharma-ui
    app.kubernetes.io/instance: pharma-ui
    app.kubernetes.io/version: "1.16.0"
