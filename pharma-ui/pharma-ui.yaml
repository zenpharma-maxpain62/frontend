---
# Source: pharma-ui/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pharma-ui
  labels:
    helm.sh/chart: pharma-ui-0.1.0
    app.kubernetes.io/name: pharma-ui
    app.kubernetes.io/instance: pharma-ui
    app.kubernetes.io/version: "1.16.0"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pharma-ui
      app.kubernetes.io/instance: pharma-ui
  template:
    metadata:
      labels:
        helm.sh/chart: pharma-ui-0.1.0
        app.kubernetes.io/name: pharma-ui
        app.kubernetes.io/instance: pharma-ui
        app.kubernetes.io/version: "1.16.0"
        app.kubernetes.io/managed-by: Helm
    spec:
      serviceAccountName: pharma-ui
      securityContext:
        fsGroup: 2000
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: pharma-ui
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
          image: "134448505602.dkr.ecr.ap-south-1.amazonaws.com/pharma-ui:sha-1234567"
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: http
          readinessProbe:
            httpGet:
              path: /
              port: http

---
# Source: pharma-ui/templates/ingress.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pharma-ui
  labels:
    helm.sh/chart: pharma-ui-0.1.0
    app.kubernetes.io/name: pharma-ui
    app.kubernetes.io/instance: pharma-ui
    app.kubernetes.io/version: "1.16.0"
    app.kubernetes.io/managed-by: Helm
  annotations:
    alb.ingress.kubernetes.io/group.name: pharma-dev
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pharma-ui
                port:
                  number: 80
